    <script>
      // 1. Force block text selection and copying everywhere except inputs
      ['selectstart', 'copy', 'contextmenu'].forEach(eventType => {
        document.addEventListener(eventType, function(e) {
          const tag = e.target.tagName;
          const isContentEditable = e.target.isContentEditable || e.target.getAttribute('contenteditable') === 'true';
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !isContentEditable) {
            e.preventDefault();
          }
        });
      });

      // 2. Empêcher le navigateur de modifier ou déformer l'application (l'application reste fixe)
      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (
          e.key === '+' || e.key === '-' || e.key === '=' || e.key === '_' || e.key === '0' ||
          e.code === 'NumpadAdd' || e.code === 'NumpadSubtract' || e.code === 'Equal' || e.code === 'Minus' || e.code === 'Digit0'
        )) {
          e.preventDefault(); // Bloque toute tentative de déformation par le navigateur
        }
      }, { passive: false });

      // 3. Bloquer le zoom molette de souris du navigateur
      window.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // 4. Bloquer le zoom par pincement tactile multi-touch (Touchpad, Écrans tactiles, Mobiles)
      window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // 5. Bloquer les gestes de zoom Safari / WebKit
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(event) {
        window.addEventListener(event, function(e) {
          e.preventDefault();
        }, { passive: false });
      });

      // 6. Bloquer le double-tap to zoom sur mobile
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          var tag = e.target.tagName;
          var isContentEditable = e.target.isContentEditable || (e.target.getAttribute && e.target.getAttribute('contenteditable') === 'true');
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !isContentEditable) {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });

      if (window.visualViewport) {
        const initialHeight = window.visualViewport.height;
        window.visualViewport.addEventListener('resize', () => {
          const bottomNav = document.querySelector('.bottom-nav');
          if (!bottomNav) return;
          if (window.visualViewport.height < initialHeight * 0.8) {
            bottomNav.style.display = 'none';
          } else {
            bottomNav.style.display = 'flex';
          }
        });
      }
    </script>
