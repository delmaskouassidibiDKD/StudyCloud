    <script>
      // Enregistrement automatique et prioritaire du Service Worker PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[StudyCloud PWA] Service Worker actif et prêt pour le hors-ligne.');
            })
            .catch(function(err) {
              console.warn('[StudyCloud PWA] Erreur enregistrement Service Worker:', err);
            });
        });
      }
    </script>
    <script>
      // 1. Force block text selection and copying everywhere except inputs
      ['selectstart', 'copy', 'contextmenu'].forEach(eventType => {
        document.addEventListener(eventType, function(e) {
          const tag = e.target.tagName;
          const isContentEditable = e.target.isContentEditable || e.target.getAttribute('contenteditable') === 'true';
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !isContentEditable) {
            e.preventDefault();
          }
        });
      });

      // 2. Gestion intelligente du zoom : adapter le zoom au document/contenu sans déformer l'interface
      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (
          e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0' ||
          e.code === 'NumpadAdd' || e.code === 'NumpadSubtract' || e.code === 'Equal' || e.code === 'Minus' || e.code === 'Digit0'
        )) {
          var delta = (e.key === '-' || e.code === 'NumpadSubtract' || e.code === 'Minus') ? -15 : (e.key === '0' || e.code === 'Digit0') ? 0 : 15;
          window.dispatchEvent(new CustomEvent('studycloud:doc-zoom', { detail: { delta: delta, reset: delta === 0 } }));
          e.preventDefault();
        }
      }, { passive: false });

      // 3. Zoom molette de souris sur document sans déformer l'application
      window.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          var delta = e.deltaY < 0 ? 15 : -15;
          window.dispatchEvent(new CustomEvent('studycloud:doc-zoom', { detail: { delta: delta, reset: false } }));
          e.preventDefault();
        }
      }, { passive: false });

      // 4. Bloquer le zoom par pincement tactile multi-touch (iOS, Android, Écrans tactiles)
      window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // 5. Bloquer les gestes de zoom spécifiques Safari / WebKit
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(event) {
        window.addEventListener(event, function(e) {
          e.preventDefault();
        }, { passive: false });
      });

      // 6. Bloquer le double-tap to zoom sur mobile
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          var tag = e.target.tagName;
          var isContentEditable = e.target.isContentEditable || (e.target.getAttribute && e.target.getAttribute('contenteditable') === 'true');
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !isContentEditable) {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });

      if (window.visualViewport) {
        const initialHeight = window.visualViewport.height;
        window.visualViewport.addEventListener('resize', () => {
          const bottomNav = document.querySelector('.bottom-nav');
          if (!bottomNav) return;
          if (window.visualViewport.height < initialHeight * 0.8) {
            bottomNav.style.display = 'none';
          } else {
            bottomNav.style.display = 'flex';
          }
        });
      }
    </script>
