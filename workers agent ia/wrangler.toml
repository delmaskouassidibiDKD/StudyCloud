name = "studycloud-agent"
account_id = "c80164ed977e6535efd1b67a54741ed6"
main = "src/server.ts"
compatibility_date = "2026-06-11"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"
remote = true

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/agents/*", "/oauth/*", "/api/*"]

[[durable_objects.bindings]]
name = "ChatAgent"
class_name = "ChatAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatAgent"]
